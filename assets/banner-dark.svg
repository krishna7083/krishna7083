<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e40af" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Animated circuit lines -->
  <g opacity="0.3">
    <line x1="0" y1="100" x2="300" y2="100" stroke="#60a5fa" stroke-width="2">
      <animate attributeName="x2" from="0" to="300" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="1200" y1="300" x2="900" y2="300" stroke="#818cf8" stroke-width="2">
      <animate attributeName="x2" from="1200" to="900" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Terminal window -->
  <rect x="50" y="50" width="1100" height="300" rx="10" fill="#0d1117" opacity="0.9" stroke="#1e40af" stroke-width="2"/>

  <!-- Terminal header -->
  <rect x="50" y="50" width="1100" height="35" rx="10" fill="#1e293b"/>
  <circle cx="75" cy="67.5" r="6" fill="#ef4444"/>
  <circle cx="100" cy="67.5" r="6" fill="#fbbf24"/>
  <circle cx="125" cy="67.5" r="6" fill="#10b981"/>
  <text x="150" y="72" font-family="JetBrains Mono, monospace" font-size="12" fill="#94a3b8">
    krushna@jpmc:~$ ./profile.sh --live
  </text>

  <!-- Terminal content -->
  <text x="80" y="130" font-family="JetBrains Mono, monospace" font-size="16" fill="#60a5fa" filter="url(#glow)">
    <tspan x="80" dy="0">#!/bin/bash</tspan>
    <tspan x="80" dy="30" fill="#94a3b8"># Initializing profile...</tspan>
    <tspan x="80" dy="30" fill="#10b981">✓ Name: </tspan>
    <tspan fill="#e2e8f0">Krushna Oza</tspan>
    <tspan x="80" dy="30" fill="#10b981">✓ Role: </tspan>
    <tspan fill="#e2e8f0">Software Engineer @ JPMorgan Chase</tspan>
    <tspan x="80" dy="30" fill="#10b981">✓ Focus: </tspan>
    <tspan fill="#e2e8f0">Data Engineering | ML | Cloud Architecture</tspan>
    <tspan x="80" dy="30" fill="#60a5fa">$ echo $PASSION</tspan>
    <tspan x="80" dy="25" fill="#818cf8">→ Building AI tools that actually work 🚀</tspan>
  </text>

  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="40" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="150" r="30" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>